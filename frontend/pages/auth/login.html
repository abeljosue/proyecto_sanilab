<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanilab | Iniciar Sesión</title>
  <link rel="stylesheet" href="/assets/css/auth.css">
  <link rel="icon" type="image/png" href="/assets/images/Sanilab-favicon.png">
</head>
<body>
  <div class="background"></div>

  <main class="auth-container">
    <div class="auth-card">
      <img src="/assets/images/Sanilab-logo.png" alt="Sanilab Logo" class="auth-logo">
      <h1 class="auth-title">Iniciar Sesión</h1>

      <form id="loginForm">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" required>

        <label for="password">Contraseña</label>
        <div class="password-wrapper">
          <input type="password" id="password" required>
          <button type="button" class="toggle-password" onclick="togglePassword('password', this)">👁</button>
        </div>

        <button type="submit">Ingresar</button>
      </form>

      <div class="links">
        <a href="/pages/auth/cambiar-password.html">¿Olvidaste tu contraseña?</a>
        <p>¿No tienes cuenta? <a href="/pages/auth/registro.html">Regístrate</a></p>
      </div>

      <small class="security">Tus datos están protegidos y no se comparten.</small>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    const API_BASE_URL = 'http://localhost:3000/api';
    axios.defaults.baseURL = API_BASE_URL;

    window.togglePassword = function(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁';
      }
    };

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const correo = document.getElementById('correo').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.querySelector('button[type="submit"]');
      
      btn.disabled = true;
      btn.textContent = 'Ingresando...';
      
      try {
        const res = await axios.post('/auth/login', { correo, password });
        
        if (res.data.token) {
          localStorage.setItem('token', res.data.token);
          localStorage.setItem('usuario', JSON.stringify(res.data.usuario));
          localStorage.setItem('usuarioid', res.data.usuario.id);
          
          window.location.href = '/pages/home/index.html';
        } else {
          alert('Credenciales incorrectas');
        }
      } catch (error) {
        console.error('Error:', error);
        alert(error.response?.data?.error || 'Error al iniciar sesión');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Ingresar';
      }
    });
  </script>
</body>
</html>
